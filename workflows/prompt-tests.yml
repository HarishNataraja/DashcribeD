name: Prompt & Unit Tests (dry)

on:
  push:
    branches: [ main, "add/*", "*" ]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install openai sqlparse python-dotenv python-pptx pillow pytest

      - name: Run prompt testing harness (dry)
        id: harness
        run: |
          set -o pipefail
          echo "Running prompt testing harness (dry) ..."
          python agentic_ai_dev_assets_extra/prompt_testing_harness.py --mode dry --sql "SELECT 1 LIMIT 1" --schema "orders(order_id)" 2>&1 | tee harness_output.log
          echo "::set-output name=log::harness_output.log"

      - name: Run unit tests
        run: |
          pytest -q || (echo "pytest failed"; exit 1)

      - name: Upload harness artifact
        uses: actions/upload-artifact@v4
        with:
          name: prompt-harness-output
          path: harness_output.log